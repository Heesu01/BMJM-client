name: "🐛 Bug report"
description: 버그를 신고합니다
labels: ["bug"]
title: "[Bug] "
assignees: []
body:
  - type: textarea
    id: describe
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 명확히 적어주세요.
      placeholder: 재현 영상/스크린샷 환영!
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱/패키지 버전
      placeholder: v1.0.0
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      value: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
  - type: textarea
    id: logs
    attributes:
      label: 로그/에러 메시지
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 체크리스트
      options:
        - label: 중복 이슈를 검색했습니다.
        - label: 최소 재현을 시도했습니다.
        - label: 관련 스크린샷/로그를 첨부했습니다.
