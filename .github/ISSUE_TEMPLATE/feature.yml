name: "✨ Feature request"
description: 새로운 기능/개선 제안
labels: ["enhancement"]
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제/배경
      description: 이 기능이 필요한 이유를 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      placeholder: 사용자 스토리/UX 흐름 등
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: checkboxes
    id: impact
    attributes:
      label: 영향 범위
      options:
        - label: 문서 변경 필요
        - label: 마이그레이션/호환성 영향 가능
